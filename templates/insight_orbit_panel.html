<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InsightOrbit - Editorial Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0D0D11', // 純粹的冷曜石黑
                        primaryRed: '#E3120B', // The Economist 極平整鮮紅
                        orbitDark: '#120507',
                        darkRed: '#2A080D'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'subtle-float': 'float 5s ease-in-out infinite',
                        'subtle-float-delayed': 'float 6s ease-in-out infinite 1s',
                        'subtle-float-slow': 'float 7s ease-in-out infinite 2s',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translate(-50%, -50%) translateY(0px)' },
                            '50%': { transform: 'translate(-50%, -50%) translateY(-10px)' },
                        },
                        spinSlow: {
                            'from': { transform: 'translate(-50%, -50%) rotate(0deg)' },
                            'to': { transform: 'translate(-50%, -50%) rotate(360deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-orb {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(227, 18, 11, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .glass-orb:hover, .glass-orb.active-orb {
            border: 1.5px solid #E3120B;
        }

        .orbit-ring {
            border: 1px solid rgba(227, 18, 11, 0.15);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            animation: spinSlow 120s linear infinite;
        }
        
        .orbit-ring:nth-child(2) {
            animation-duration: 180s;
            animation-direction: reverse;
            border: 1px solid rgba(227, 18, 11, 0.1);
        }

        .orbit-ring:nth-child(3) {
            animation-duration: 240s;
            border: 1px solid rgba(227, 18, 11, 0.05);
        }
        
        .capsule {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
        }
    </style>
</head>
<body class="bg-obsidian text-gray-300 overflow-hidden h-screen w-screen relative font-sans">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DashboardHeader = () => {
            const [time, setTime] = useState("");
            useEffect(() => {
                const update = () => {
                    const now = new Date();
                    const tomorrow = new Date();
                    tomorrow.setHours(24,0,0,0);
                    const diff = tomorrow - now;
                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    setTime(`T-${h}H ${m}M`);
                };
                update();
                const timer = setInterval(update, 60000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-40 pointer-events-none">
                    <div className="flex items-center space-x-4">
                        <div className="w-8 h-8 bg-primaryRed flex items-center justify-center font-bold text-white tracking-tighter">
                            IN
                        </div>
                        <div className="h-5 w-px bg-gray-600"></div>
                        <div className="text-white font-bold tracking-widest uppercase text-sm">INSIGHTORBIT</div>
                        <div className="text-gray-500 font-mono text-xs tracking-wider uppercase hidden sm:block">ORBIT // {new Date().toISOString().split('T')[0]}</div>
                    </div>
                    <div className="font-mono text-sm tracking-wider text-slate-400">
                        NEXT SYNC <span className="text-primaryRed">{time}</span>
                    </div>
                </div>
            );
        };

        const OrbitBackground = ({ activeArticle, isDesktop }) => {
            // When inactive, align rings with the triangle center (left: 50%, top: 55%)
            // When active, align rings with the active orb (left: 25%, top: 50% for desktop)
            const centerX = activeArticle ? (isDesktop ? '25%' : '50%') : '50%';
            const centerY = activeArticle ? (isDesktop ? '50%' : '15%') : '55%';
            
            return (
                <div 
                    className="absolute inset-0 pointer-events-none overflow-hidden transition-transform duration-1000 ease-in-out"
                    style={{ transform: `translate(calc(${centerX} - 50%), calc(${centerY} - 55%))` }}
                >
                    <div className="orbit-ring w-[40vw] h-[40vw] min-w-[300px] min-h-[300px] max-w-[500px] max-h-[500px]"></div>
                    <div className="orbit-ring w-[60vw] h-[60vw] min-w-[500px] min-h-[500px] max-w-[800px] max-h-[800px]"></div>
                    <div className="orbit-ring w-[80vw] h-[80vw] min-w-[700px] min-h-[700px] max-w-[1100px] max-h-[1100px]"></div>
                </div>
            );
        };

        const DeepDivePanel = ({ tag, cache, setCache, onClose, setActiveTag }) => {
            const [data, setData] = useState(cache[tag]);
            const [loading, setLoading] = useState(!cache[tag]);
            const [isDesktop, setIsDesktop] = useState(window.innerWidth >= 768);

            useEffect(() => {
                const handleResize = () => setIsDesktop(window.innerWidth >= 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                if (cache[tag]) {
                    setData(cache[tag]);
                    setLoading(false);
                } else {
                    setLoading(true);
                    fetch(`/api/tags/${encodeURIComponent(tag)}`)
                        .then(r => r.json())
                        .then(d => {
                            setCache(prev => ({...prev, [tag]: d}));
                            setData(d);
                            setLoading(false);
                        });
                }
            }, [tag, cache, setCache]);

            if (loading) return (
                <div className={`fixed inset-0 z-50 flex ${isDesktop ? 'justify-end' : 'items-end'}`}>
                    <div className="absolute inset-0 bg-obsidian/40 backdrop-blur-sm transition-opacity" onClick={onClose}></div>
                    <div className={`relative bg-obsidian border-l border-darkRed h-full ${isDesktop ? 'w-[480px] lg:w-[560px] animate-pulse' : 'w-full h-[65vh] rounded-t-3xl'}`}></div>
                </div>
            );

            if (!data) return null;

            return (
                <div 
                    className={`fixed top-0 z-50 shadow-2xl transition-transform duration-300 ease-out bg-obsidian border-l border-red-900/30 flex flex-col
                        ${isDesktop ? 'right-0 h-full w-[480px] lg:w-[560px]' : 'bottom-0 w-full h-[85vh] rounded-t-3xl'}
                    `}
                    onClick={(e) => e.stopPropagation()}
                >
                    <div className="h-16 flex items-center justify-between px-6 border-b border-red-900/30">
                        <div className="flex items-center space-x-3">
                            <span className="px-2 py-1 text-xs font-mono tracking-wider text-primaryRed border border-primaryRed/30 rounded-sm">
                                {(!data.type || data.type.toLowerCase() === 'entity') ? 'TOPIC' : data.type.toUpperCase()}
                            </span>
                            <h2 className="text-xl font-bold text-white">{data.title}</h2>
                        </div>
                        {/* Removed redundant close button */}
                    </div>
                        <div className="flex-1 px-6 py-5 overflow-y-auto no-scrollbar space-y-8">
                            <section>
                                <h3 className="text-xs font-mono text-gray-500 mb-3 uppercase tracking-widest">AI Glossary</h3>
                                <div className="p-4 rounded-sm border border-gray-800">
                                    <p className="text-gray-300 leading-relaxed text-sm">{data.glossary || data.explanation}</p>
                                    <div className="mt-4 p-3 bg-red-950/20 rounded-sm border border-primaryRed/20">
                                        <p className="text-sm text-white font-medium leading-snug">{data.takeaway}</p>
                                    </div>
                                    {data.related_keywords && data.related_keywords.length > 0 && (
                                        <div className="mt-4 flex gap-2 flex-wrap">
                                            {data.related_keywords.map(kw => (
                                                <span 
                                                    key={kw}
                                                    onClick={(e) => { e.stopPropagation(); setActiveTag(kw); }}
                                                    className="px-2 py-1 text-xs font-mono tracking-wide bg-obsidian border border-gray-700 text-gray-400 hover:border-primaryRed hover:text-white cursor-pointer rounded-sm transition-colors uppercase"
                                                >
                                                    # {kw}
                                                </span>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </section>
                            <section>
                                <h3 className="text-xs font-mono text-gray-500 mb-4 uppercase tracking-widest">Historical Events</h3>
                                {(!data.timeline || data.timeline.length === 0) ? (
                                    <div className="text-center py-6 border border-dashed border-gray-800 rounded-sm">
                                        <p className="text-gray-600 text-sm font-mono">First observed in today's orbit.</p>
                                    </div>
                                ) : (
                                    <div className="relative border-l border-gray-700 ml-2 space-y-6">
                                        {data.timeline.map((event, idx) => (
                                            <div key={idx} className="relative pl-5">
                                                <div className={`absolute -left-[4.5px] top-1 w-2 h-2 rounded-full ${idx===0 ? 'bg-primaryRed' : 'bg-gray-600'}`}></div>
                                                <div className="text-xs font-mono text-gray-500 mb-1">{event.date.substring(0,10)}</div>
                                                <h4 className="text-sm font-bold text-white mb-1 leading-snug">{event.headline}</h4>
                                                <p className="text-sm text-gray-400 leading-relaxed">{event.summary}</p>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </section>
                        </div>
                </div>
            );
        };

        const App = () => {
            const [orbit, setOrbit] = useState([]);
            const [activeArticle, setActiveArticle] = useState(null);
            const [activeTag, setActiveTag] = useState(null);
            const [cache, setCache] = useState({});
            const [isDesktop, setIsDesktop] = useState(window.innerWidth >= 768);

            useEffect(() => {
                fetch('/api/today')
                    .then(r => r.json())
                    .then(d => {
                        if (d.orbit) setOrbit(d.orbit);
                    });
                
                const handleResize = () => setIsDesktop(window.innerWidth >= 768);
                window.addEventListener('resize', handleResize);
                
                // Esc key to close global
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        if (activeTag) setActiveTag(null);
                        else setActiveArticle(null);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                
                return () => {
                    window.removeEventListener('resize', handleResize);
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, [activeTag]);

            // Desktop Triangle
            const desktopCoords = [
                { top: '35%', left: '50%' },
                { top: '65%', left: '35%' },
                { top: '65%', left: '65%' }
            ];
            // Mobile Vertical
            const mobileCoords = [
                { top: '25%', left: '50%' },
                { top: '50%', left: '50%' },
                { top: '75%', left: '50%' }
            ];
            const getCoords = (i) => isDesktop ? desktopCoords[i] : mobileCoords[i];
            
            // Anchor point when active (moved slightly left and slightly smaller)
            const activeCoords = isDesktop ? { top: '50%', left: activeTag ? '15%' : '25%' } : { top: '15%', left: '50%' };
            
            const anims = ['animate-subtle-float', 'animate-subtle-float-delayed', 'animate-subtle-float-slow'];
            
            const categoryLabels = [
                'MACRO', 
                'SUPPLY CHAIN', 
                'EQUITY'
            ];

            const handleOrbClick = (article, e) => {
                e.stopPropagation();
                if (activeArticle === article) {
                    setActiveArticle(null); // toggle off
                    setActiveTag(null);
                } else {
                    setActiveArticle(article);
                    setActiveTag(null);
                }
            };

            const handleBackgroundClick = () => {
                if (activeTag) {
                    setActiveTag(null); // Level 3 -> Level 2
                } else if (activeArticle) {
                    setActiveArticle(null); // Level 2 -> Level 1
                }
            };

            return (
                <div className="w-full h-full relative" onClick={handleBackgroundClick}>
                    <DashboardHeader />
                    
                    {/* Removed Level 2 top-left ✕ button */}
                    
                    <OrbitBackground activeArticle={activeArticle} isDesktop={isDesktop} />
                    
                    {/* Level 2: Neural Beams & Capsules */}
                    {activeArticle && (
                            <div className="absolute inset-0 z-20 pointer-events-none">
                                {/* Draw SVG lines first so they are under capsules */}
                                <svg className="absolute inset-0 w-full h-full opacity-80">
                                    {activeArticle.tags.map((tag, idx) => {
                                        // Emit from exact right edge (desktop) or bottom edge (mobile)
                                        const startX = isDesktop ? (activeTag ? 'calc(15% + 128px)' : 'calc(25% + 128px)') : '50%';
                                        const startY = isDesktop ? '50%' : 'calc(20% + 112px)';
                                        
                                        // Terminate exactly at the left edge of the capsule container
                                        const capLeftVal = activeTag ? 35 : 55;
                                        const endX = isDesktop ? `calc(${capLeftVal}% - 60px)` : '50%';
                                        const endY = isDesktop ? `${30 + (idx * 15)}%` : `${45 + (idx * 12)}%`;
                                        
                                        return (
                                            <line 
                                                key={`line-${idx}`}
                                                x1={startX} y1={startY} x2={endX} y2={endY}
                                                stroke="#FF1744" strokeWidth="1" strokeDasharray="3 3"
                                                className="animate-pulse transition-all duration-500 ease-out"
                                            />
                                        );
                                    })}
                                </svg>

                                {/* Render Capsules */}
                                {activeArticle.tags.map((tag, idx) => {
                                    const capTop = isDesktop ? `${30 + (idx * 15)}%` : `${45 + (idx * 12)}%`;
                                const capLeft = isDesktop ? (activeTag ? '35%' : '55%') : '50%';
                                // Apply type-based styling
                                const t = (tag.type || '').toLowerCase();
                                let capsuleClass = "border border-gray-700 bg-obsidian hover:border-primaryRed text-white"; // default
                                if (t === 'entity' || t === '機構' || t === '企業') {
                                    capsuleClass = "bg-white text-black font-bold hover:bg-gray-200 border-white";
                                } else if (t === 'market' || t === '變革') {
                                    capsuleClass = "bg-primaryRed text-white font-bold hover:bg-red-500 border-primaryRed";
                                }

                                return (
                                    <div 
                                        key={tag.name}
                                        onClick={(e) => { e.stopPropagation(); setActiveTag(tag.name); }}
                                        className="absolute z-30 capsule cursor-pointer transform -translate-x-1/2 -translate-y-1/2 pointer-events-auto shadow-xl"
                                        style={{ top: capTop, left: capLeft }}
                                    >
                                        <div className={`px-4 py-2 rounded-sm flex items-center space-x-2 transition-colors ${capsuleClass}`}>
                                            {(t !== 'entity' && t !== '機構' && t !== '企業') && (
                                                <div className="w-1.5 h-1.5 bg-current"></div>
                                            )}
                                            <span className="text-sm tracking-wide font-mono">{tag.name}</span>
                                            <span className="opacity-50 text-xs font-mono ml-1">↗</span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* Level 1: Orbs */}
                    {orbit.map((article, i) => {
                        const isActive = activeArticle === article;
                        const isFaded = activeArticle && !isActive;
                        
                        // Use fixed left rail logic for active state on desktop
                        const desktopActive = { top: '50%', left: activeTag ? '15%' : '25%' };
                        const mobileActive = { top: '20%', left: '50%' };
                        
                        const coords = activeArticle ? (isActive ? (isDesktop ? desktopActive : mobileActive) : getCoords(i)) : getCoords(i);
                        
                        const isTop1 = i === 0;
                        const baseSize = isTop1 ? 'w-64 h-64 lg:w-72 lg:h-72' : 'w-52 h-52 lg:w-56 lg:h-56';
                        const activeSize = 'w-56 h-56 lg:w-64 lg:h-64'; 
                        
                        const labelText = categoryLabels[i] || `TAG ${i+1}`;

                        return (
                            <div 
                                key={article.id}
                                onClick={(e) => handleOrbClick(article, e)}
                                className={`absolute z-30 group glass-orb rounded-full flex flex-col items-center justify-between p-7 cursor-pointer transition-all duration-300 ease-out
                                    -translate-x-1/2 -translate-y-1/2 ${isActive ? 'active-orb' : ''}
                                    ${activeArticle ? '' : anims[i]}
                                    ${isActive ? `${activeSize}` : `${baseSize} hover:scale-[1.03] hover:border-[#E3120B]`}
                                    ${isFaded ? 'opacity-0 scale-75 pointer-events-none' : 'opacity-100'}
                                `}
                                style={{ top: coords.top, left: coords.left }}
                            >
                                {/* 1. Internalized Category Badge */}
                                <span className="text-[10px] lg:text-[11px] font-mono tracking-widest text-slate-400 group-hover:text-primaryRed transition-colors uppercase mt-2">
                                    [ 0{i+1} // {labelText} ]
                                </span>
                                
                                {/* 2. Adaptive Headline (Scales on Hover & Active) */}
                                <div className="flex items-center justify-center flex-1 w-full px-2 text-center">
                                    <h3 
                                        className={`text-white font-bold transition-all duration-200 ease-out
                                            ${isActive 
                                                ? 'text-xs lg:text-sm line-clamp-none leading-relaxed' 
                                                : 'text-base lg:text-lg line-clamp-2 leading-snug group-hover:text-xs group-hover:lg:text-sm group-hover:line-clamp-none group-hover:leading-relaxed'}
                                        `}
                                        style={{ wordBreak: 'break-word' }}
                                    >
                                        {article.title}
                                    </h3>
                                </div>
                                
                                {/* 3. Entity Pills (Bottom) */}
                                <div className="flex gap-1.5 flex-wrap justify-center mb-2 opacity-100 transition-opacity duration-200">
                                    {article.tags.slice(0, 2).map((t, idx) => (
                                        <span key={idx} className="px-2 py-0.5 rounded text-[10px] font-semibold bg-primaryRed text-white tracking-wide uppercase">
                                            {t.name}
                                        </span>
                                    ))}
                                </div>
                            </div>
                        );
                    })}

                    {/* Level 3: Drawer */}
                    {activeTag && (
                        <DeepDivePanel 
                            tag={activeTag} 
                            cache={cache} 
                            setCache={setCache} 
                            onClose={(e) => { if(e) e.stopPropagation(); setActiveTag(null); }} 
                            setActiveTag={setActiveTag}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
