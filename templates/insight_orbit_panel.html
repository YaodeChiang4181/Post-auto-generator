<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InsightOrbit - Financial Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#000000', // 純黑霧面底
                        primaryRed: '#FF2A42', // 霓虹電氣紅
                        orbitDark: '#120507',
                        darkRed: '#2A080D'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'subtle-float': 'float 5s ease-in-out infinite',
                        'subtle-float-delayed': 'float 6s ease-in-out infinite 1s',
                        'subtle-float-slow': 'float 7s ease-in-out infinite 2s',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translate(-50%, -50%) translateY(0px)' },
                            '50%': { transform: 'translate(-50%, -50%) translateY(-10px)' },
                        },
                        spinSlow: {
                            'from': { transform: 'translate(-50%, -50%) rotate(0deg)' },
                            'to': { transform: 'translate(-50%, -50%) rotate(360deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .bottom-sheet { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .bottom-sheet.dragging { transition: none; }
        
        .glass-orb {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            border: 1.5px solid #FF2A42;
            box-shadow: 0 0 45px rgba(255, 42, 66, 0.45);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .glass-orb:hover {
            box-shadow: 0 0 60px rgba(255, 42, 66, 0.6);
        }

        .orbit-ring {
            border: 1.5px dashed rgba(255, 42, 66, 0.25);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            animation: spinSlow 120s linear infinite;
        }
        
        .orbit-ring:nth-child(2) {
            animation-duration: 180s;
            animation-direction: reverse;
            border: 1px dashed rgba(255, 42, 66, 0.15);
        }

        .orbit-ring:nth-child(3) {
            animation-duration: 240s;
            border: 1px dashed rgba(255, 42, 66, 0.1);
        }
        
        .capsule {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
        }
    </style>
</head>
<body class="bg-obsidian text-gray-300 overflow-hidden h-screen w-screen relative font-sans">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DashboardHeader = () => {
            const [time, setTime] = useState("");
            useEffect(() => {
                const update = () => {
                    const now = new Date();
                    const tomorrow = new Date();
                    tomorrow.setHours(24,0,0,0);
                    const diff = tomorrow - now;
                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    setTime(`T-${h}H ${m}M`);
                };
                update();
                const timer = setInterval(update, 60000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-40 pointer-events-none">
                    <h1 className="text-white font-bold tracking-widest uppercase text-sm">Orbit of {new Date().toISOString().split('T')[0]}</h1>
                </div>
            );
        };

        const OrbitBackground = () => (
            <div className="absolute inset-0 pointer-events-none overflow-hidden flex items-center justify-center">
                <div className="orbit-ring w-[40vw] h-[40vw] min-w-[300px] min-h-[300px] max-w-[500px] max-h-[500px]"></div>
                <div className="orbit-ring w-[60vw] h-[60vw] min-w-[500px] min-h-[500px] max-w-[800px] max-h-[800px]"></div>
                <div className="orbit-ring w-[80vw] h-[80vw] min-w-[700px] min-h-[700px] max-w-[1100px] max-h-[1100px]"></div>
            </div>
        );

        const DeepDivePanel = ({ tag, cache, setCache, onClose }) => {
            const [data, setData] = useState(cache[tag]);
            const [loading, setLoading] = useState(!cache[tag]);
            const [isDesktop, setIsDesktop] = useState(window.innerWidth >= 768);

            useEffect(() => {
                const handleResize = () => setIsDesktop(window.innerWidth >= 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                if (!cache[tag]) {
                    setLoading(true);
                    fetch(`/api/tags/${encodeURIComponent(tag)}`)
                        .then(r => r.json())
                        .then(d => {
                            setCache(prev => ({...prev, [tag]: d}));
                            setData(d);
                            setLoading(false);
                        });
                }
            }, [tag]);

            if (loading) return (
                <div className={`fixed inset-0 z-50 flex ${isDesktop ? 'justify-end' : 'items-end'}`}>
                    <div className="absolute inset-0 bg-obsidian/40 backdrop-blur-sm transition-opacity" onClick={onClose}></div>
                    <div className={`relative bg-obsidian border-l border-darkRed h-full ${isDesktop ? 'w-[480px] lg:w-[560px] animate-pulse' : 'w-full h-[65vh] rounded-t-3xl'}`}></div>
                </div>
            );

            if (!data) return null;

            return (
                <div className={`fixed inset-0 z-50 flex ${isDesktop ? 'justify-end' : 'items-end'}`}>
                    <div className="absolute inset-0 bg-[#000000]/60 backdrop-blur-sm transition-opacity" onClick={onClose}></div>
                    <div className={`relative bg-gradient-to-b from-[#120507] to-[#000000] border-l border-red-900/30 flex flex-col shadow-2xl ${isDesktop ? 'h-full w-[480px] lg:w-[560px]' : 'w-full rounded-t-3xl h-[85vh]'}`}>
                        <div className="h-16 flex items-center justify-between px-6 border-b border-red-900/30">
                            <div className="flex items-center space-x-3">
                                <span className="px-2 py-1 text-xs font-mono tracking-wider text-primaryRed bg-red-950/40 border border-primaryRed/30 rounded">
                                    {data.type ? data.type.toUpperCase() : 'TOPIC'}
                                </span>
                                <h2 className="text-xl font-bold text-white">{data.title}</h2>
                            </div>
                            <button className="text-gray-400 hover:text-white" onClick={onClose}>✕</button>
                        </div>
                        <div className="flex-1 px-6 py-5 overflow-y-auto no-scrollbar space-y-8">
                            <section>
                                <h3 className="text-sm font-mono text-gray-400 mb-3 uppercase">AI Glossary</h3>
                                <div className="bg-red-950/10 p-4 rounded-xl border border-red-900/20">
                                    <p className="text-gray-300 leading-relaxed text-sm">{data.glossary || data.explanation}</p>
                                    <div className="mt-4 p-3 bg-red-950/40 rounded border border-red-500/20">
                                        <p className="text-sm text-white font-medium leading-snug">💡 {data.takeaway}</p>
                                    </div>
                                </div>
                            </section>
                            <section>
                                <h3 className="text-sm font-mono text-gray-400 mb-4 uppercase">Historical Events</h3>
                                {(!data.timeline || data.timeline.length === 0) ? (
                                    <div className="text-center py-6 border border-dashed border-red-900/40 rounded-xl">
                                        <p className="text-gray-500 text-sm">First observed in today's orbit.</p>
                                    </div>
                                ) : (
                                    <div className="relative border-l border-red-900/50 ml-2 space-y-6">
                                        {data.timeline.map((event, idx) => (
                                            <div key={idx} className="relative pl-5">
                                                <div className={`absolute -left-[4.5px] top-1 w-2 h-2 rounded-full ${idx===0 ? 'bg-primaryRed shadow-[0_0_10px_#FF2A42]' : 'bg-gray-600'}`}></div>
                                                <div className="text-xs font-mono text-gray-500 mb-1">{event.date.substring(0,10)}</div>
                                                <h4 className="text-sm font-bold text-white mb-1">{event.headline}</h4>
                                                <p className="text-sm text-gray-400">{event.summary}</p>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </section>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [orbit, setOrbit] = useState([]);
            const [activeArticle, setActiveArticle] = useState(null);
            const [activeTag, setActiveTag] = useState(null);
            const [cache, setCache] = useState({});
            const [isDesktop, setIsDesktop] = useState(window.innerWidth >= 768);

            useEffect(() => {
                fetch('/api/today')
                    .then(r => r.json())
                    .then(d => {
                        if (d.orbit) setOrbit(d.orbit);
                    });
                
                const handleResize = () => setIsDesktop(window.innerWidth >= 768);
                window.addEventListener('resize', handleResize);
                
                // Esc key to close global
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') setActiveArticle(null);
                };
                window.addEventListener('keydown', handleKeyDown);
                
                return () => {
                    window.removeEventListener('resize', handleResize);
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, []);

            // Desktop Triangle
            const desktopCoords = [
                { top: '35%', left: '50%' },
                { top: '65%', left: '35%' },
                { top: '65%', left: '65%' }
            ];
            // Mobile Vertical
            const mobileCoords = [
                { top: '25%', left: '50%' },
                { top: '50%', left: '50%' },
                { top: '75%', left: '50%' }
            ];
            const getCoords = (i) => isDesktop ? desktopCoords[i] : mobileCoords[i];
            
            // Anchor point when active (moved slightly left and slightly smaller)
            const activeCoords = isDesktop ? { top: '50%', left: '25%' } : { top: '15%', left: '50%' };
            
            const anims = ['animate-subtle-float', 'animate-subtle-float-delayed', 'animate-subtle-float-slow'];
            
            const categoryLabels = [
                '[REGULATORY // 監管與法規]', 
                '[SUPPLY CHAIN // 供應鏈重組]', 
                '[MARKET MOVER // 營收與動能]'
            ];

            const handleOrbClick = (article, e) => {
                e.stopPropagation();
                if (activeArticle === article) {
                    setActiveArticle(null); // toggle off
                } else {
                    setActiveArticle(article);
                }
            };

            const closeLevel2 = () => {
                if (activeTag) return;
                setActiveArticle(null);
            };

            return (
                <div className="w-full h-full relative" onClick={closeLevel2}>
                    <DashboardHeader />
                    
                    {activeArticle && (
                        <button 
                            onClick={closeLevel2}
                            className="absolute top-6 left-6 z-50 text-white opacity-40 hover:opacity-100 hover:text-primaryRed text-2xl transition-all cursor-pointer"
                        >
                            ✕
                        </button>
                    )}
                    
                    <OrbitBackground />
                    
                    {/* Level 2: Neural Beams & Capsules */}
                    {activeArticle && (
                        <div className="absolute inset-0 z-20 pointer-events-none">
                            {/* Draw SVG lines first so they are under capsules */}
                            <svg className="absolute inset-0 w-full h-full opacity-80">
                                {activeArticle.tags.map((tag, idx) => {
                                    const startX = isDesktop ? '25%' : '50%';
                                    const startY = isDesktop ? '50%' : '15%';
                                    const endX = isDesktop ? '55%' : '50%';
                                    const endY = isDesktop ? `${30 + (idx * 15)}%` : `${35 + (idx * 15)}%`;
                                    return (
                                        <line 
                                            key={`line-${idx}`}
                                            x1={startX} y1={startY} x2={endX} y2={endY}
                                            stroke="#FF2A42" strokeWidth="1.5" strokeDasharray="4 4"
                                            className="animate-pulse"
                                        />
                                    );
                                })}
                            </svg>

                            {/* Render Capsules */}
                            {activeArticle.tags.map((tag, idx) => {
                                const capTop = isDesktop ? `${30 + (idx * 15)}%` : `${35 + (idx * 15)}%`;
                                const capLeft = isDesktop ? '55%' : '50%';
                                // Apply type-based styling
                                const t = (tag.type || '').toLowerCase();
                                let capsuleClass = "border border-primaryRed/40 bg-red-950/80 hover:bg-primaryRed/20 text-white"; // default
                                if (t === 'entity' || t === '機構' || t === '企業') {
                                    capsuleClass = "bg-white text-black font-bold hover:bg-gray-200 border-white";
                                } else if (t === 'market' || t === '變革') {
                                    capsuleClass = "bg-primaryRed text-white font-bold hover:bg-red-500 border-primaryRed";
                                }

                                return (
                                    <div 
                                        key={tag.name}
                                        onClick={(e) => { e.stopPropagation(); setActiveTag(tag.name); }}
                                        className="absolute z-30 capsule cursor-pointer transform -translate-x-1/2 -translate-y-1/2 pointer-events-auto"
                                        style={{ top: capTop, left: capLeft }}
                                    >
                                        <div className={`px-4 py-2 rounded-full flex items-center space-x-2 transition-colors ${capsuleClass}`}>
                                            {(t !== 'entity' && t !== '機構' && t !== '企業') && (
                                                <div className="w-2 h-2 rounded-full bg-white"></div>
                                            )}
                                            <span className="text-sm tracking-wide">{tag.name}</span>
                                            <span className="opacity-70 text-xs font-mono ml-1">↗</span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* Level 1: Orbs */}
                    {orbit.map((article, i) => {
                        const isActive = activeArticle === article;
                        const isFaded = activeArticle && !isActive;
                        const coords = activeArticle ? (isActive ? activeCoords : getCoords(i)) : getCoords(i);
                        
                        const isTop1 = i === 0;
                        const baseSize = isTop1 ? 'w-64 h-64 lg:w-72 lg:h-72' : 'w-52 h-52 lg:w-56 lg:h-56';
                        // Active size slightly shrunk by 10% (using Tailwind scale-90 or just smaller width)
                        const activeSize = 'w-56 h-56 lg:w-64 lg:h-64'; 

                        return (
                            <div 
                                key={article.id}
                                onClick={(e) => handleOrbClick(article, e)}
                                className={`absolute z-30 glass-orb rounded-full flex flex-col items-center justify-center p-8 cursor-pointer transition-all duration-300
                                    -translate-x-1/2 -translate-y-1/2
                                    ${activeArticle ? '' : anims[i]}
                                    ${isActive ? `${activeSize}` : `${baseSize} hover:scale-105`}
                                    ${isFaded ? 'opacity-0 scale-75 pointer-events-none' : 'opacity-100'}
                                `}
                                style={{ top: coords.top, left: coords.left }}
                            >
                                {/* External Label */}
                                <div className="absolute -top-12 left-1/2 transform -translate-x-1/2 text-primaryRed font-sans text-5xl lg:text-6xl font-black italic opacity-90 drop-shadow-[0_0_15px_rgba(255,42,66,0.8)]">
                                    {i + 1}
                                </div>
                                
                                <h2 className="text-white font-bold text-base lg:text-lg text-center leading-relaxed break-words w-full px-2 line-clamp-3" style={{ wordBreak: 'break-word' }}>
                                    {article.title}
                                </h2>
                                
                                {!isActive && (
                                    <div className="mt-5 flex flex-wrap justify-center gap-2 opacity-80">
                                        {article.tags.slice(0,2).map(t => (
                                            <span key={t.name} className="text-[11px] text-gray-200 uppercase px-2 py-0.5 border border-gray-500 rounded bg-black/40">
                                                {t.name}
                                            </span>
                                        ))}
                                    </div>
                                )}
                            </div>
                        );
                    })}

                    {/* Level 3: Drawer */}
                    {activeTag && (
                        <DeepDivePanel 
                            tag={activeTag} 
                            cache={cache} 
                            setCache={setCache} 
                            onClose={(e) => { if(e) e.stopPropagation(); setActiveTag(null); }} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
