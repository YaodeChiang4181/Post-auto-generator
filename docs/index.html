                    const now = new Date();
                    const tomorrow = new Date();
                    tomorrow.setHours(24,0,0,0);
                    const diff = tomorrow - now;
                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);

                }
            }, [tag, cache, setCache]);

            if (loading) return (
                <div className={`fixed inset-0 z-50 flex ${isDesktop ? 'justify-end' : 'items-end'}`}>
                    <div className="absolute inset-0 bg-obsidian/40 backdrop-blur-sm transition-opacity" onClick={onClose}></div>
                    <div className={`relative bg-obsidian border-l border-darkRed h-full ${isDesktop ? 'w-[480px] lg:w-[560px]' : 'w-full h-[55vh] rounded-t-3xl border-t'} overflow-hidden`}>
                        <div className="absolute inset-0 p-6 flex flex-col space-y-8 animate-pulse">
                            <div className="h-16 border-b border-red-900/30 flex items-center space-x-3">
                                <div className="w-16 h-6 bg-red-900/20 rounded-sm"></div>
                                <div className="w-48 h-6 bg-gray-800 rounded-sm"></div>
                            </div>
                            <div className="space-y-4">
                                <div className="w-24 h-3 bg-gray-800 rounded-sm"></div>
                                <div className="w-full h-24 bg-gray-900 border border-gray-800 rounded-sm p-4 space-y-2">
                                    <div className="w-full h-3 bg-gray-800 rounded-sm"></div>
                                    <div className="w-5/6 h-3 bg-gray-800 rounded-sm"></div>
                                    <div className="w-4/6 h-3 bg-gray-800 rounded-sm"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            if (!data) return null;

            return (
                <div 
                    className={`fixed z-50 shadow-2xl transition-transform duration-300 ease-out bg-obsidian border-red-900/30 flex flex-col
                        ${isDesktop ? 'top-0 right-0 h-full w-[480px] lg:w-[560px] border-l' : 'bottom-0 w-full h-[55vh] rounded-t-3xl border-t'}
                    `}
                    onClick={(e) => e.stopPropagation()}
                >
                    <div className="h-16 flex items-center justify-between px-6 border-b border-red-900/30">
                        <div className="flex items-center space-x-3">
                            <span className="px-2 py-1 text-xs font-mono tracking-wider text-primaryRed border border-primaryRed/30 rounded-sm">
                                {(!data.type || data.type.toLowerCase() === 'entity') ? 'TOPIC' : data.type.toUpperCase()}
                            </span>
                            <h2 className="text-xl font-bold text-white">{data.title}</h2>
                        </div>
                        <button 
                            onClick={onClose}
                            className="text-gray-500 hover:text-white font-mono text-sm px-2 py-1 transition-colors"
                        >
                            ✕
                        </button>
                    </div>
                    <div className="flex-1 px-6 py-5 overflow-y-auto no-scrollbar space-y-8">
                        <section>
                            <h3 className="text-xs font-mono text-gray-500 mb-3 uppercase tracking-widest">AI Glossary</h3>
                            <div className="p-4 rounded-sm border border-gray-800 bg-black/30">
                                <p className="text-gray-300 leading-relaxed text-sm">{data.glossary || data.explanation}</p>
                                {data.takeaway && (
                                    <div className="mt-4 p-3 bg-red-950/20 rounded-sm border border-primaryRed/20">
                                        <p className="text-sm text-white font-medium leading-snug">{data.takeaway}</p>
                                    </div>
                                )}
                                {data.related_keywords && data.related_keywords.length > 0 && (
                                    <div className="mt-4 flex gap-2 flex-wrap">
                                        {data.related_keywords.map(kw => (
                                            <span 
                                                key={kw}
                                                onClick={(e) => { e.stopPropagation(); setActiveTag(kw); }}
                                                className="px-2 py-1 text-xs font-mono tracking-wide bg-obsidian border border-gray-700 text-gray-400 hover:border-primaryRed hover:text-white cursor-pointer rounded-sm transition-colors uppercase"
                                            >
                                                # {kw}
                                            </span>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </section>
                        <section>
                            <h3 className="text-xs font-mono text-gray-500 mb-4 uppercase tracking-widest">Historical Events (跨時空脈絡)</h3>
                            {(!data.timeline || data.timeline.length === 0) ? (
                                <div className="text-center py-6 border border-dashed border-gray-800 rounded-sm">
                                    <p className="text-gray-600 text-sm font-mono">First observed in today's orbit.</p>
                                </div>
                            ) : (
                                <div className="relative border-l border-gray-700 ml-2 space-y-6">
                                    {data.timeline.map((event, idx) => (
                                        <div 
                                            key={idx} 
                                            className="relative pl-5 py-2 cursor-pointer hover:bg-red-950/20 rounded-md transition-colors -ml-2 group"
                                            onClick={() => onEventClick && onEventClick(event)}
                                            title="點擊切換 Orbit 主視角到此歷史新聞"
                                        >
                                            <div className={`absolute left-[3.5px] top-3 w-2 h-2 rounded-full ${idx===0 ? 'bg-primaryRed' : 'bg-gray-600'} group-hover:scale-125 transition-transform`}></div>
                                            <div className="text-xs font-mono text-gray-500 mb-1 pl-2 flex items-center justify-between">
                                                <span>{event.date ? event.date.substring(0,10) : ''}</span>
                                                <span className="text-[10px] text-primaryRed opacity-0 group-hover:opacity-100 transition-opacity font-mono">切換視角 ↗</span>
                                            </div>
                                            <h4 className="text-sm font-bold text-white mb-1 leading-snug pl-2 group-hover:text-primaryRed transition-colors">{event.headline}</h4>
                                            <p className="text-sm text-gray-400 leading-relaxed pl-2 line-clamp-2">{event.summary}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </section>
                    </div>
                </div>
            );
        };

        const App = () => {
            const initialData = window.__INITIAL_DATA__ || { orbit: [], tags: {} };
            const [orbit, setOrbit] = useState(initialData.orbit || []);
            const [activeArticle, setActiveArticle] = useState(null);
            const [activeTag, setActiveTag] = useState(null);
            const [cache, setCache] = useState(initialData.tags || {});
            const [isDesktop, setIsDesktop] = useState(window.innerWidth >= 768);

            useEffect(() => {
                // 優先嘗試從多個可能靜態路徑拉取最新資料 (支援根目錄或 docs 子目錄)
                const candidatePaths = ['./docs/data/orbit_data.json', './data/orbit_data.json'];
                const tryFetchPath = (index) => {
                    if (index >= candidatePaths.length) {
                        // 後端 API 備援
                        fetch('/api/today')
                            .then(r => r.ok ? r.json() : null)
                            .then(d => {
                                if (d && d.orbit) setOrbit(d.orbit);
                            })
                            .catch(() => {});
                        return;
                    }
                    fetch(candidatePaths[index])
                        .then(r => {
                            if (!r.ok) throw new Error("not found");
                            return r.json();
                        })
                        .then(d => {
                            if (d.orbit) setOrbit(d.orbit);
                            if (d.tags) setCache(prev => ({ ...prev, ...d.tags }));
                        })
                        .catch(() => tryFetchPath(index + 1));
                };
                tryFetchPath(0);
            }, []);

            useEffect(() => {
                const handleResize = () => setIsDesktop(window.innerWidth >= 768);
                window.addEventListener('resize', handleResize);
                
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        if (activeTag) setActiveTag(null);
                        else setActiveArticle(null);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                
                return () => {
                    window.removeEventListener('resize', handleResize);
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, [activeTag]);

            // Desktop Triangle
            const desktopCoords = [
                { top: '35%', left: '50%' },
                { top: '65%', left: '35%' },
                { top: '65%', left: '65%' }
            ];
            // Mobile Vertical
            const mobileCoords = [
                { top: '25%', left: '50%' },
                { top: '52%', left: '35%' },
                { top: '75%', left: '65%' }
            ];
            const getCoords = (i) => isDesktop ? desktopCoords[i] : mobileCoords[i];
            
            const anims = ['animate-subtle-float', 'animate-subtle-float-delayed', 'animate-subtle-float-slow'];
            
            const categoryLabels = [
                'MACRO', 
                'SUPPLY CHAIN', 
                'EQUITY'
            ];

            // 跨時空歷史新聞點擊：將點擊的歷史新聞切換為當前主 Orbit
            const handleHistoricalEventClick = (event) => {
                const pastArticle = {
                    id: event.id,
                    title: event.headline,
                    summary: event.summary,
                    source_url: event.source,
                    created_at: event.date,
                    tags: event.tags || []
                };

                setOrbit(prev => {
                    if (prev.find(a => a.id === pastArticle.id)) return prev;
                    let newOrbit = [...prev];
                    const activeIndex = newOrbit.findIndex(a => a === activeArticle);
                    if (activeIndex !== -1) {
                        newOrbit[activeIndex] = pastArticle;
                    } else {
                        newOrbit = [pastArticle, ...newOrbit].slice(0, 3);
                    }
                    return newOrbit;
                });
                
                setActiveArticle(pastArticle);
                setActiveTag(null);
            };

            const handleOrbClick = (article, e) => {
                e.stopPropagation();
                if (activeArticle === article) {
                    setActiveArticle(null);
                    setActiveTag(null);
                } else {
                    setActiveArticle(article);
                    setActiveTag(null);
                }
            };

            const handleBackgroundClick = () => {
                if (activeTag) {
                    setActiveTag(null);
                } else if (activeArticle) {
                    setActiveArticle(null);
                }
            };

            return (
                <div className="w-full h-full relative" onClick={handleBackgroundClick}>
                    <DashboardHeader />
                    
                    <OrbitBackground activeArticle={activeArticle} isDesktop={isDesktop} />
                    
                    {/* Level 2: Neural Beams & Capsules */}
                    {activeArticle && (
                        <div className="absolute inset-0 z-20 pointer-events-none">
                            <svg className="absolute inset-0 w-full h-full opacity-80">
                                {activeArticle.tags.map((tag, idx) => {
                                    const mobileLeft = idx % 2 === 0 ? 25 : 75;
                                    const mobileTop = 36 + (idx * 9);
                                    
                                    const startX = isDesktop ? (activeTag ? '15%' : '25%') : '50%';
                                    const startY = isDesktop ? '50%' : '20%';
                                    
                                    const endX = isDesktop ? (activeTag ? '35%' : '55%') : `${mobileLeft}%`;
                                    const endY = isDesktop ? `${30 + (idx * 15)}%` : `${mobileTop}%`;
                                    
                                    return (
                                        <line 
                                            key={idx}
                                            x1={startX} y1={startY} 
                                            x2={endX} y2={endY}
                                            stroke="#E3120B" 
                                            strokeWidth="1.5" 
                                            strokeDasharray="4 4"
                                            className="opacity-50"
                                        />
                                    );
                                })}
                            </svg>

                            {activeArticle.tags.map((tag, idx) => {
                                const mobileLeft = idx % 2 === 0 ? 25 : 75;
                                const mobileTop = 36 + (idx * 9);

                                const capLeft = isDesktop ? (activeTag ? '35%' : '55%') : `${mobileLeft}%`;
                                const capTop = isDesktop ? `${30 + (idx * 15)}%` : `${mobileTop}%`;
                                
                                const t = (tag.type || tag.tag_type || 'concept').toLowerCase();
                                const isConcept = t === 'concept' || t === '概念';
                                
                                const capsuleClass = isConcept
                                    ? 'bg-black/60 border border-primaryRed/40 text-primaryRed hover:bg-primaryRed hover:text-white'
                                    : 'bg-black/60 border border-gray-600 text-gray-300 hover:border-gray-400 hover:text-white';

                                return (
                                    <div 
                                        key={idx}
                                        onClick={(e) => { e.stopPropagation(); setActiveTag(tag.name); }}
                                        className="absolute z-30 capsule cursor-pointer transform -translate-x-1/2 -translate-y-1/2 pointer-events-auto shadow-xl"
                                        style={{ top: capTop, left: capLeft }}
                                    >
                                        <div className={`px-4 py-2 rounded-sm flex items-center space-x-2 transition-colors ${capsuleClass}`}>
                                            {(t !== 'entity' && t !== '機構' && t !== '企業') && (
                                                <div className="w-1.5 h-1.5 bg-current"></div>
                                            )}
                                            <span className="text-sm tracking-wide font-mono whitespace-nowrap">{tag.name}</span>
                                            <span className="opacity-50 text-xs font-mono ml-1">↗</span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* Level 1: Orbs */}
                    {orbit.map((article, i) => {
                        const isActive = activeArticle === article;
                        const isFaded = activeArticle && !isActive;
                        
                        const desktopActive = { top: '50%', left: activeTag ? '15%' : '25%' };
                        const mobileActive = { top: '20%', left: '50%' };
                        
                        const coords = activeArticle ? (isActive ? (isDesktop ? desktopActive : mobileActive) : getCoords(i)) : getCoords(i);
                        
                        const isTop1 = i === 0;
                        const baseSize = isTop1 ? 'w-44 h-44 md:w-56 md:h-56 lg:w-72 lg:h-72' : 'w-36 h-36 md:w-48 md:h-48 lg:w-56 lg:h-56';
                        const activeSize = 'w-40 h-40 md:w-48 md:h-48 lg:w-64 lg:h-64'; 
                        
                        const labelText = categoryLabels[i] || `TAG ${i+1}`;

                        return (
                            <div 
                                key={article.id}
                                onClick={(e) => handleOrbClick(article, e)}
                                className={`absolute z-30 group glass-orb rounded-full flex flex-col items-center justify-between p-4 md:p-7 cursor-pointer transition-all duration-300 ease-out
                                    -translate-x-1/2 -translate-y-1/2 ${isActive ? 'active-orb' : ''}
                                    ${activeArticle ? '' : anims[i]}
                                    ${isActive ? `${activeSize}` : `${baseSize} hover:scale-[1.03] hover:border-[#E3120B]`}
                                    ${isFaded ? 'opacity-0 scale-75 pointer-events-none' : 'opacity-100'}
                                `}
                                style={{ top: coords.top, left: coords.left }}
                            >
                                <span className="text-[8px] md:text-[9px] lg:text-[10px] whitespace-nowrap font-mono tracking-widest text-slate-400 group-hover:text-primaryRed transition-colors uppercase mt-1 md:mt-2">
                                    [ 0{i+1} // {labelText} ]
                                </span>
                                
                                <div className="flex items-center justify-center flex-1 w-full px-1 md:px-2 text-center">
                                    <h3 
                                        className={`text-white font-bold transition-all duration-200 ease-out
                                            ${isActive 
                                                ? 'text-[10px] md:text-xs lg:text-sm line-clamp-none leading-relaxed' 
                                                : 'text-xs md:text-base lg:text-lg line-clamp-2 md:line-clamp-3 leading-snug group-hover:text-[10px] group-hover:md:text-xs group-hover:lg:text-sm group-hover:line-clamp-none group-hover:leading-relaxed'}
                                        `}
                                        style={{ wordBreak: 'break-word' }}
                                    >
                                        {article.title}
                                    </h3>
                                </div>
                                
                                <div className="flex flex-col items-center gap-2 mb-2 w-full px-4 opacity-100 transition-opacity duration-200">
                                    <div className="flex gap-1.5 flex-wrap justify-center">
                                        {(article.tags || []).slice(0, 2).map((t, idx) => (
                                            <span key={idx} className="px-2 py-0.5 rounded text-[10px] font-semibold bg-primaryRed text-white tracking-wide uppercase">
                                                {t.name}
                                            </span>
                                        ))}
                                    </div>
                                    
                                    {isActive && (
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); window.open(article.source_url, '_blank'); }}
                                            className="mt-1 w-full max-w-[140px] py-1.5 bg-[#8b0000] hover:bg-primaryRed text-white text-xs font-bold tracking-widest rounded-sm transition-colors duration-300 z-50 pointer-events-auto border border-primaryRed"
                                        >
                                            跳轉看新聞
                                        </button>
                                    )}
                                </div>
                            </div>
                        );
                    })}

                    {/* Level 3: Drawer */}
                    {activeTag && (
                        <DeepDivePanel 
                            tag={activeTag} 
                            cache={cache} 
                            setCache={setCache} 
                            onClose={(e) => { if(e) e.stopPropagation(); setActiveTag(null); }} 
                            setActiveTag={setActiveTag}
                            onEventClick={handleHistoricalEventClick}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
