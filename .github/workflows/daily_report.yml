name: Daily LinkedIn Content Automation

on:
  schedule:
    # 每天 UTC 時間 00:15 執行 (對應台灣時間 08:15，提早排程以避開 GitHub Actions 整點/半點的塞車延遲)
    - cron: '15 0 * * *'
  workflow_dispatch: # 允許手動從 GitHub 網頁觸發

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Run automation script
      env:
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py

    - name: 💾 Commit and Push SQLite State
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        # Add the database first to ensure it's tracked before diffing
        git add data/state.db
        if git diff --cached --quiet; then
          echo "No changes to state database."
        else
          git commit -m "chore: auto-update state database"
          git push
        fi
