name: Daily LinkedIn Content Automation

on:
  schedule:
    # 每天 UTC 時間 20:13 執行 (對應台灣時間 04:13，提早排程以避開 GitHub Actions 塞車延遲)
    - cron: '13 20 * * *'
  workflow_dispatch: # 允許手動從 GitHub 網頁觸發

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 📧 Restore Gmail OAuth credentials
      env:
        GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
        GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
      if: ${{ env.GMAIL_CREDENTIALS != '' && env.GMAIL_TOKEN != '' }}
      run: |
        echo "$GMAIL_CREDENTIALS" > credentials.json
        echo "$GMAIL_TOKEN" > token.json
        echo "✅ Gmail credentials restored"
        echo "credentials.json size: $(wc -c < credentials.json) bytes"
        echo "token.json size: $(wc -c < token.json) bytes"

    - name: 🚀 Run automation script
      env:
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "=== Pre-flight check ==="
        echo "credentials.json exists: $(test -f credentials.json && echo YES || echo NO)"
        echo "token.json exists: $(test -f token.json && echo YES || echo NO)"
        echo "========================"
        python main.py

